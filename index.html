
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c35">
  <title>StitchBook — Daily Work Records</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <h1>StitchBook</h1>
    <p>Daily stitching work records</p>
  </header>

  <main>
    <section id="loginPanel" class="card">
      <h2>Sign in</h2>
      <p>Sign in with your registered worker or administrator account.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password"
               autocomplete="current-password" required>

        <button id="loginButton" type="submit">Sign in</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section id="appPanel" class="card hidden">
      <h2 id="welcomeHeading">Welcome to StitchBook</h2>
      <p id="roleMessage"></p>
      <button id="logoutButton" type="button">Log out</button>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
